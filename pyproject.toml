[project]
name = "slate-mcp"
version = "0.1.0"
description = "Shared blackboard MCP server for multiple agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dimitrensen" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.3.0",
]

[project.scripts]
slate = "slate_mcp.cli:main"
slate-mcp = "slate_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
