# Profiles keep `docker compose up` from starting a server you did not ask for.
# stdio:  docker compose --profile stdio run --rm -i slate
# SSE:    docker compose --profile sse up -d --build
# Share the host file with uv clients: SLATE_DATA="$HOME/.slate"

x-slate: &slate
  image: slate-mcp:local
  build:
    context: .
  environment:
    SLATE_DB: /data/slate.db
    HOME: /tmp
    PYTHONUNBUFFERED: "1"
  volumes:
    - ${SLATE_DATA:-./.slate-data}:/data
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  security_opt:
    - no-new-privileges:true
  deploy:
    resources:
      limits:
        memory: 256M
        cpus: "0.50"
        pids: 64

services:
  slate:
    <<: *slate
    profiles: ["stdio"]
    stdin_open: true
    restart: "no"

  slate-sse:
    <<: *slate
    profiles: ["sse"]
    command: ["--transport", "sse", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped
